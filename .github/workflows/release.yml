name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install WP-CLI
        run: |
          curl -fsSL -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php wp-cli.phar --info
          sudo install -m 0755 wp-cli.phar /usr/local/bin/wp

      - name: Check tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER="$(sed -n 's/^[ *]*Version:[[:space:]]*//p' revolter-cookies.php | head -n1 | tr -d '[:space:]')"
          CONSTANT="$(sed -n "s/^define( 'REVOLTER_COOKIES_VERSION', '\\([^']*\\)' );/\\1/p" revolter-cookies.php | head -n1)"
          STABLE="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -n1 | tr -d '[:space:]')"
          echo "tag=$TAG header=$HEADER constant=$CONSTANT stable=$STABLE"
          if [ -z "$TAG" ] || [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONSTANT" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Version header, REVOLTER_COOKIES_VERSION and readme Stable tag." >&2
            exit 1
          fi

      - name: Build zip
        run: bash bin/build-zip.sh

      - name: Check zip
        run: bash bin/check-zip.sh build/revolter-cookies.zip

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/revolter-cookies.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/revolter-cookies.zip --generate-notes
          fi
